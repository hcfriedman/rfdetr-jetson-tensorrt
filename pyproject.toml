[project]
name = "rfdetr-jetson-tensorrt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henry Friedman", email = "henrycfriedman@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "nvidia-cudss-cu12",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "onnx>=1.22.0",
    "onnxruntime-gpu==1.24.0",
    "opencv-python>=4.10,<5",
    "pypylon>=26.7",
    "rfdetr>=1.9.2",
    "numpy<2",
    "cuda-python==12.6.*",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "jetson" }
torchvision = { index = "jetson" }
onnxruntime-gpu = { index = "jetson" }

[[tool.uv.index]]
name = "jetson"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true
